<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">GopherAtlas favicon</title>
  <desc id="desc">A minimalist compass favicon in blue and slate tones for GopherAtlas.</desc>
  <defs>
    <linearGradient id="ring" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dbe8f7"/>
      <stop offset="0.45" stop-color="#7b8da8"/>
      <stop offset="1" stop-color="#31455f"/>
    </linearGradient>
    <linearGradient id="needleBlue" x1="24" y1="12" x2="46" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="needleLight" x1="18" y1="46" x2="34" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="24" fill="#0f172a"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#ring)" stroke-width="3.5"/>
  <circle cx="32" cy="32" r="15.5" fill="none" stroke="#334155" stroke-width="1.25" opacity="0.85"/>

  <g stroke-linecap="round" opacity="0.95">
    <line x1="32" y1="11.5" x2="32" y2="16.5" stroke="#cbd5e1" stroke-width="2.2"/>
    <line x1="52.5" y1="32" x2="47.5" y2="32" stroke="#94a3b8" stroke-width="2"/>
    <line x1="32" y1="52.5" x2="32" y2="47.5" stroke="#94a3b8" stroke-width="2"/>
    <line x1="11.5" y1="32" x2="16.5" y2="32" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <g filter="url(#softGlow)">
    <path d="M32 32 L49 15 L37.5 39.5 Z" fill="url(#needleBlue)"/>
    <path d="M32 32 L15 49 L26.5 24.5 Z" fill="url(#needleLight)"/>
  </g>

  <circle cx="32" cy="32" r="3.3" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
  <circle cx="32" cy="32" r="1.35" fill="#0f172a"/>

  <circle cx="32" cy="32" r="28" fill="none" stroke="#38bdf8" stroke-opacity="0.16" stroke-width="1.5"/>
</svg>
